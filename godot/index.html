<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>밤 원정대</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
/* 밤 원정대 고돗 웹판: Google 로그인 창은 Firebase 로그인(웹판 게임과 같은 계정 · 같은 주소면 로그인도 이어짐)으로 띄우고,
   받은 로그인 토큰은 고돗(net/fb.gd)이 REST로 씀. 모든 함수는 cb(글자) — 성공이면 사용자 JSON(없으면 ""), 실패면 "ERR:코드" */
window.PNAuth = (function () {
  const cfg = {"apiKey": "AIzaSyBoAamDWbuakNFfwm5yw0INWAVL2jU9SzQ", "authDomain": "project-night-66395.firebaseapp.com", "databaseURL": "https://project-night-66395-default-rtdb.asia-southeast1.firebasedatabase.app", "projectId": "project-night-66395", "storageBucket": "project-night-66395.firebasestorage.app", "messagingSenderId": "221196608316", "appId": "1:221196608316:web:e0e1dd5220e8165041f439"}; let auth = null, pend = null;
  function init() { if (auth) return; if (typeof firebase === "undefined") throw { code: "firebase-unavailable" }; try { firebase.initializeApp(cfg); } catch (e) {} auth = firebase.auth(); }
  async function pack(u, extra) { if (!u) return ""; const t = await u.getIdToken(); return JSON.stringify(Object.assign({ uid: u.uid, idToken: t, refreshToken: u.refreshToken, exp: Date.now() / 1000 + 3300, anon: !!u.isAnonymous, email: u.email || "", name: u.displayName || "" }, extra || {})); }
  function run(p, cb) { p.then(v => cb(v == null ? "" : String(v)), e => cb("ERR:" + ((e && (e.code || e.message)) || e))); }
  const prov = () => { const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt: "select_account" }); return p; };
  const api = {
    current(cb) { init(); let done = false; try { auth.getRedirectResult().catch(() => {}); } catch (e) {}
      const off = auth.onAuthStateChanged(u => { if (done) return; done = true; off(); run(pack(u), cb); });
      setTimeout(() => { if (!done) { done = true; cb(""); } }, 8000); },
    guest(cb) { init(); run(auth.signInAnonymously().then(r => pack(r.user)), cb); },
    google(cb) { init(); run(auth.signInWithPopup(prov()).then(r => pack(r.user)), cb); },
    // 손님 → Google 연결(같은 계정 ID). 이미 쓰던 Google 계정이면 "ERR:auth/credential-already-in-use" — 고돗이 손님 기록을 정리한 뒤 useCredential로 그 계정에 들어감
    link(cb) { init(); const u = auth.currentUser; if (!u) { run(auth.signInWithPopup(prov()).then(r => pack(r.user, { switched: true })), cb); return; }
      run(u.linkWithPopup(prov()).then(async () => { await auth.currentUser.reload(); return pack(auth.currentUser, { linked: true }); })
        .catch(e => { if (e && e.code === "auth/credential-already-in-use" && e.credential) pend = e.credential; throw e; }), cb); },
    useCredential(cb) { init(); if (!pend) { cb("ERR:no-credential"); return; } const c = pend; pend = null; run(auth.signInWithCredential(c).then(r => pack(r.user, { switched: true })), cb); },
    signOut(cb) { init(); run(auth.signOut().then(() => "ok"), cb); },
    deleteMe(cb) { init(); const u = auth.currentUser; if (!u) { cb("ok"); return; }   // 오래전에 로그인한 Google 계정이면 다시 로그인 창(웹 pn-net.js와 같게)
      run(u.delete().catch(async e => { if (e && e.code === "auth/requires-recent-login" && !u.isAnonymous) { await u.reauthenticateWithPopup(prov()); await auth.currentUser.delete(); return; } throw e; }).then(() => "ok"), cb); }
  };
  // 어느 함수든 바로 실패하면(Firebase를 못 불러옴 등) 예외 대신 cb("ERR:…") — 시작 확인(current)은 로그인 없음으로
  const out = {};
  for (const k of Object.keys(api)) out[k] = cb => { try { api[k](cb); } catch (e) { cb(k === "current" ? "" : "ERR:" + ((e && (e.code || e.message)) || e)); } };
  return out;
})();
</script>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":12905684,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
